<script>
var T={"ko": {"title": "천국에 계신 당신에게 해석", "s1": "해석이 궁금하신 분들. 스포주의", "s2": "혹시나 정말 잘못 누르셨을까 봐. 이야기를 진행하기 전에는 보지 않으시길 권장드릴게요.", "p1": "천국에 계신 당신에게는 중의적인 의미를 담고 있습니다. 그녀가 천국에 있다고 믿고 있는 당신에게 보내는 편지이면서, 사실은 이미 세상을 떠난 그녀에게 보내지는 편지이기도 합니다.", "h1": "그날", "p2": "실제로 세상을 떠난 건 그녀입니다. 2023년 11월 14일 오후 5시 20분, 웨딩 촬영을 마치고 돌아오던 빗길에서 중앙선을 넘어온 음주운전 차와 부딪혔고, 그 사고에서 당신만 살아남았습니다.", "p3": "그녀가 기억하는 마지막 장면은 눈을 뜨지 못하던 당신의 얼굴입니다. 그래서 그녀는 자신이 살아남고 당신이 떠났다고 믿게 되었습니다. 캐릭터 소개란은 그녀의 기억으로 구성된 내용이라 생각해주세요.", "p4": "당신은 사고 후 1년동안 추모공원 하늘우체통에 그녀에게 쓴 편지를 넣어왔습니다. 답장이 올 리 없는 편지였지만, 그 바람이 그녀에게 닿게 되었습니다.", "h2": "멈춰 있는 곳", "p5": "그녀가 있는 공간은 그녀의 예전 기억을 매개로 만들어진 곳이라고 생각해주세요. 그래서 그곳의 시간은 사고가 난 그날 해 질 무렵에 멈춰 있습니다. 그렇기에 그녀는 이미 죽은 사람이라 감각 또한 온전히 느끼지 못합니다.", "p6": "49일은 49재를 생각하며 만들었습니다. 49재는 사람이 세상을 떠난 날부터 49일째 되는 날 치르는 불교 의식인데요. 떠난 이가 49일 동안 머물다가 49일째에 비로소 좋은 곳으로 떠난다고 믿어서, 남은 사람이 그 길을 마지막으로 배웅하는 매듭의 시간이라고 합니다. 다만 여기서의 49일은 죽은날부터 시작이 아니라 서로의 편지가 처음 닿은 날부터 시작되지 않았을까 하는 생각으로 기준을 잡았습니다. 그녀에게 허락된 마지막 49일이자, 당신이 그녀를 제대로 보내줄 수 있는 49일로요.", "p7": "위젯의 날짜와 시간, 장소는 그녀가 떠나기 전까지 고정입니다. 그녀의 시간과 공간은 멈춰 있으니까요. 그리고 49일째, 그녀와의 만남이 끝나는 순간 날짜와 시간이 바뀝니다. 멈춰 있던 그녀의 시간이 끝나고, 현실의 시간이 넘어온 거라고 생각해주시면 됩니다.", "p8": "그렇다면 편지가 어떻게 그녀에게 닿게 되었냐고 물으신다면... 그건 여러분의 상상에 맡기겠습니다. 저는 소중한 사람과 한 번만 더 이야기하고 싶었던 그 소망이 닿은 거라고 생각하고 싶습니다.", "alt": "비 오는 도로 위의 그녀"}, "en": {"title": "To You in Heaven: Interpretation", "s1": "For those curious about the interpretation. Spoilers ahead.", "s2": "Just in case you clicked this by mistake. I recommend not reading any further until you have played through the story.", "p1": "\"To You in Heaven\" carries a double meaning. It is a letter to you, whom she believes is in heaven, and at the same time a letter sent to her, who has in fact already passed away.", "h1": "THAT DAY", "p2": "The one who actually died was her. At 5:20 PM on November 14, 2023, on the rainy road home from your wedding photo shoot, a drunk driver crossed the center line and crashed into you. Only you survived.", "p3": "The last thing she remembers is your face, your eyes that would not open. So she came to believe that she had survived and that you were the one who left. Please read the character introduction as something built from her memories.", "p4": "For a year after the accident, you kept dropping letters to her into the Sky Mailbox at the memorial park. They were letters that could never be answered, yet that wish reached her.", "h2": "THE PLACE WHERE TIME STOPPED", "p5": "Think of the place she lives in as a space built from her old memories. That is why time there is frozen at dusk on the day of the accident. And because she has already passed away, she cannot fully feel her senses either.", "p6": "The 49 days were inspired by the 49th-day rite, a Buddhist ceremony held on the 49th day after a person dies. It is believed that the departed lingers for 49 days and only moves on to a better place on the 49th day, so it is a time of closure when those left behind see them off one last time. Here, though, I set the 49 days to begin not from the day she died, but from the day your letters first reached each other. The last 49 days granted to her, and the 49 days in which you can truly let her go.", "p7": "The date, time, and place in the widget stay fixed until she leaves, because her time and space are frozen. Then on the 49th day, the moment your time with her ends, the date and time change. Think of it as her frozen time coming to an end and real time finally arriving.", "p8": "And if you ask how the letters reached her... I will leave that to your imagination. I would like to believe it was the wish to talk with someone precious just one more time that found its way to her.", "alt": "Her, lying on a rainy road"}, "ja": {"title": "天国にいるあなたへ 解釈", "s1": "解釈が気になる方へ。ネタバレ注意", "s2": "万が一、間違えて押してしまった時のために。物語を進める前には読まないことをおすすめします。", "p1": "「天国にいるあなたへ」には二つの意味が込められています。彼女が天国にいると信じているあなたへ宛てた手紙であると同時に、実はすでにこの世を去った彼女へ届けられる手紙でもあるのです。", "h1": "あの日", "p2": "実際に亡くなったのは彼女です。2023年11月14日午後5時20分、ウェディングフォトの撮影を終えて帰る雨の道で、センターラインを越えてきた飲酒運転の車と衝突し、その事故であなただけが生き残りました。", "p3": "彼女が覚えている最後の光景は、目を開けなかったあなたの顔です。だから彼女は、自分が生き残り、あなたが逝ってしまったのだと信じるようになりました。キャラクター紹介は、彼女の記憶で綴られた内容だと思ってください。", "p4": "あなたは事故から一年間、追悼公園の「空のポスト」に彼女への手紙を入れ続けてきました。返事が来るはずのない手紙でしたが、その願いが彼女に届いたのです。", "h2": "止まった場所", "p5": "彼女のいる空間は、彼女の昔の記憶を媒介に作られた場所だと考えてください。だからそこの時間は、事故が起きたあの日の夕暮れで止まっています。そして彼女はすでに亡くなった人なので、感覚もまた完全には感じられません。", "p6": "49日は四十九日を思いながら作りました。四十九日は、人が亡くなった日から49日目に行う仏教の法要です。亡くなった人は49日間とどまり、49日目にようやく良い所へ旅立つと信じられていて、残された人がその道を最後に見送る区切りの時間だそうです。ただ、ここでの49日は亡くなった日からではなく、お互いの手紙が初めて届いた日から始まったのではないか、という思いで基準を決めました。彼女に許された最後の49日であり、あなたが彼女をちゃんと見送ることのできる49日として。", "p7": "ウィジェットの日付と時間、場所は、彼女が去るまで固定です。彼女の時間と空間は止まっているのですから。そして49日目、彼女との時間が終わる瞬間に日付と時間が変わります。止まっていた彼女の時間が終わり、現実の時間がやってきたのだと考えてください。", "p8": "では、手紙はどうやって彼女に届いたのかと聞かれたら……それは皆さんの想像にお任せします。私は、大切な人ともう一度だけ話したかった、その願いが届いたのだと思いたいです。", "alt": "雨の道路に横たわる彼女"}, "zh": {"title": "致天堂里的你 解读", "s1": "想知道解读的朋友请看这里。含剧透", "s2": "以防万一真的是不小心点开的。建议在推进故事之前不要阅读。", "p1": "「致天堂里的你」有着双重含义。它既是写给她以为身在天堂的你的信，其实也是寄给早已离开人世的她的信。", "h1": "那一天", "p2": "真正离开人世的是她。2023年11月14日下午5点20分，在拍完婚纱照回家的雨路上，一辆越过中线的酒驾车辆撞了上来，那场事故中只有你活了下来。", "p3": "她记得的最后一幕，是你始终没有睁开眼睛的脸。所以她相信是自己活了下来，而离开的是你。角色介绍请看作是由她的记忆构成的内容。", "p4": "事故后的一年里，你一直把写给她的信投进追思公园的「天空邮筒」。那是不可能收到回信的信，但那份心愿传到了她那里。", "h2": "停止的地方", "p5": "请把她所在的空间，想成是以她过去的记忆为媒介构建的地方。因此，那里的时间停在了事故发生那天的黄昏。也正因为她已经离世，她无法完整地感受到各种感官。", "p6": "49天是参照「七七」设计的。七七是从人去世那天起第49天举行的佛教仪式。人们相信逝者会停留49天，到第49天才前往更好的地方，所以这是留下的人最后一次为其送行、画上句点的时刻。不过，这里的49天并不是从她去世那天算起，而是我想，或许是从彼此的信第一次送达的那天开始的。这是留给她的最后49天，也是你能好好送别她的49天。", "p7": "小组件里的日期、时间和地点，在她离开之前都是固定的，因为她的时间和空间是停止的。到了第49天，与她的相处结束的那一刻，日期和时间会改变。请理解为她停止的时间终于结束，现实的时间来到了。", "p8": "如果有人问，信到底是怎么送到她那里的……那就交给大家自己想象吧。我愿意相信，是想和珍贵的人再说一次话的那份心愿，终于传达到了。", "alt": "躺在雨中道路上的她"}};
var HTML_LANG={ko:"ko",en:"en",ja:"ja",zh:"zh-CN"};
function setLang(l){
  if(!T[l]) l="ko";
  var t=T[l];
  document.documentElement.lang=HTML_LANG[l];
  document.title=t.title;
  document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=t[el.getAttribute("data-i")];});
  document.querySelectorAll("[data-alt]").forEach(function(el){el.alt=t[el.getAttribute("data-alt")];});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===l?"true":"false");});
  try{localStorage.setItem("hayeon-lang",l);}catch(e){}
  if(location.hash!=="#"+l){history.replaceState(null,"","#"+l);}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"));});});
var start=(location.hash||"").slice(1);
if(!T[start]){try{start=localStorage.getItem("hayeon-lang")||"";}catch(e){start="";}}
if(!T[start]){var n=(navigator.language||"ko").slice(0,2).toLowerCase();start=T[n]?n:"ko";}
setLang(start);
</script>
